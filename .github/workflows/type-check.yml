name: Type Check
on:
  pull_request:
    branches: [ main ]
jobs:
  mypy:
    runs-on: ubuntu-latest
    name: Type check with mypy
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: 3.10
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    - name: Run mypy
      run: |
        mypy api backend
